name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render Video with Docker
        run: |
          npx hyperframes render --docker --strict --output hasil-video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: Video-Hasil-Render
          path: hasil-video.mp4