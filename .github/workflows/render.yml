name: Render HyperFrames Video

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render Video with HyperFrames
        run: |
          npx -y hyperframes render index.html -o hasil-video.mp4

      - name: Upload Video ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Video-Hasil-Render
          path: hasil-video.mp4