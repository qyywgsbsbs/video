name: Render HyperFrames Video

# Dijalankan manual dari HP: tab Actions > Render HyperFrames Video > Run workflow
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Render video
        run: npx -y hyperframes@latest render --composition index.html -o hasil-video.mp4 --fps 30

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-hasil
          path: hasil-video.mp4
          retention-days: 7
