<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .text {
      font-size: 120px;
      font-weight: bold;
      color: #38bdf8;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-50px); }
    }
  </style>
</head>
<body>
  <!-- Konfigurasi HyperFrames: Lebar 1280, Tinggi 720, Durasi 5 detik -->
  <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720">
    <div class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="text">Halo GitHub!</div>
    </div>
  </div>
</body>
</html>
